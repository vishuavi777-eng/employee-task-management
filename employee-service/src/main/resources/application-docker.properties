# =========================================================
# Employee Service - DEVELOPMENT configuration
# =========================================================

server.port=${SERVER_PORT:8081}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://host.docker.internal:3306/employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=root
spring.datasource.password=Vishu@321

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka

eureka.client.service-url.defaultZone=${EUREKA_URL:http://host.docker.internal:8761/eureka/}

# Logging and Actuator
logging.level.com.vishwambhar.microservices.employee_service=DEBUG
management.endpoint.health.show-details=always