spring:
  datasource:
    url: jdbc:h2:mem:employee_service_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  cloud:
    config:
      enabled: false

    discovery:
      enabled: false

  config:
    import: ""

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
