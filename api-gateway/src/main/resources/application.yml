spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: employee-service-route
              uri: lb://employee-service
              predicates:
                - Path=/api/v1/employees/**

            - id: task-service-route
              uri: lb://task-service
              predicates:
                - Path=/api/v1/tasks/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    gateway:
      access: read-only