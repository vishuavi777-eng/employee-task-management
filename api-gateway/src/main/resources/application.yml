spring:
  application:
    name: api-gateway

  profiles:
    active: dev

  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: employee-service-route
              uri: lb://employee-service
              predicates:
                - Path=/api/v1/employees/**

            - id: task-service-route
              uri: lb://task-service
              predicates:
                - Path=/api/v1/tasks/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoint:
    gateway:
      access: read-only

logging:
  file:
    name: "${user.home}/microservices-logs/api-gateway.log"