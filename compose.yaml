name: employee-task-microservices

services:

  # ========================================================
  # MySQL
  # ========================================================
  mysql:
    image: mysql:8.4

    ports:
      - "127.0.0.1:3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Vishu@321}
      MYSQL_ROOT_HOST: "%"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - microservices-network


  # ========================================================
  # RabbitMQ
  # ========================================================
  rabbitmq:
    image: rabbitmq:4-management

    hostname: rabbitmq

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - microservices-network


  # ========================================================
  # Zipkin
  # ========================================================
  zipkin:
    image: openzipkin/zipkin:3

    ports:
      - "127.0.0.1:9411:9411"

    networks:
      - microservices-network


  # ========================================================
  # Config Server
  # ========================================================
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8888:8888"

    environment:
      SERVER_PORT: "8888"
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repository/
#      CONFIG_REPOSITORY_URI: file:///config-repository
#      CONFIG_REPOSITORY_BRANCH: main
#      XDG_CONFIG_HOME: /tmp/.config

    volumes:
      - ../config-repository:/config-repository:ro

    restart: on-failure

    networks:
      - microservices-network


  # ========================================================
  # Eureka Server
  # ========================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8761:8761"

    environment:
      SERVER_PORT: "8761"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

    depends_on:
      config-server:
        condition: service_started
      zipkin:
        condition: service_started

    restart: on-failure

    networks:
      - microservices-network


  # ========================================================
  # Employee Service
  # ========================================================
  employee-service:
    build:
      context: ./employee-service
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8081:8081"

    environment:
      SERVER_PORT: "8081"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888

      DB_URL: jdbc:mysql://mysql:3306/employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Vishu@321}

      EUREKA_URL: http://eureka-server:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      zipkin:
        condition: service_started

    restart: on-failure

    networks:
      - microservices-network


  # ========================================================
  # Task Service
  # ========================================================
  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8082:8082"

    environment:
      SERVER_PORT: "8082"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888

      DB_URL: jdbc:mysql://mysql:3306/task_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Vishu@321}

      EUREKA_URL: http://eureka-server:8761/eureka/

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      zipkin:
        condition: service_started

    restart: on-failure

    networks:
      - microservices-network


  # ========================================================
  # Notification Service
  # ========================================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8083:8083"

    environment:
      SERVER_PORT: "8083"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888

      DB_URL: jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Vishu@321}

      EUREKA_URL: http://eureka-server:8761/eureka/

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      zipkin:
        condition: service_started

    restart: on-failure

    networks:
      - microservices-network


  # ========================================================
  # API Gateway
  # ========================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888

      EUREKA_URL: http://eureka-server:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      zipkin:
        condition: service_started

    restart: on-failure

    networks:
      - microservices-network


# ==========================================================
# Network
# ==========================================================
networks:
  microservices-network:
    driver: bridge


# ==========================================================
# Persistent Volumes
# ==========================================================
volumes:
  mysql-data:
  rabbitmq-data: